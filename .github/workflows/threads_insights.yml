name: Daily Threads Insights

# Threads 게시글 성과(조회·좋아요·답글·리포스트·인용·공유)를 수집해
# 게시 계획과 같은 구글 시트의 '인사이트' 탭에 덮어쓰고, 요약을 텔레그램으로 보냅니다.
# 토큰에 threads_manage_insights 권한이 필요합니다.
on:
  schedule:
    # 매일 23:10 KST (14:10 UTC) — 하루 3개 발행이 끝난 뒤
    - cron: '10 14 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간(일)'
        required: false
        default: '30'

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: marketing_automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: marketing_automation/requirements.txt
      - run: pip install -r requirements.txt
      - name: Collect Threads insights
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          THREADS_SHEET_ID: ${{ vars.THREADS_SHEET_ID || '1Ty-mQNQYD0lS6xFXx66Jn3ML54V583tDHURoX5VXWnc' }}
        run: python -m pipeline.threads_insights --days ${{ github.event.inputs.days || '30' }} --sheet --telegram
