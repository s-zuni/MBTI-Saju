name: Daily MBTI x Saju Reel & Shorts Automation

on:
  schedule:
    # 매일 18:25 KST (09:25 UTC). 정각(00/30분) 대기열 병목 회피
    # cron-job.org 웹훅 설정 시 workflow_dispatch로 오차 0초 즉시 실행 가능
    - cron: '25 9 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 주제 지정 (비워두면 자동 바이럴 기획)'
        required: false
        default: ''
      youtube_schedule:
        description: 'YouTube Shorts KST 예약 공개 시각 (기본 18:30, none 입력 시 즉시 공개)'
        required: false
        default: '18:30'
      visual_theme:
        description: '비주얼 컨셉 (auto: 8:2 자동 비율, human: 사람 공감, animal: 고정 동물 캐릭터)'
        required: false
        default: 'auto'

jobs:
  generate_and_publish:
    name: Generate & Publish Reel/Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: marketing_automation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: marketing_automation/requirements.txt

      - name: Install FFmpeg & Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk
          mkdir -p ~/.fonts
          cp assets/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium for Google Flow (when FLOW_STORAGE_STATE_B64 is set)
        env:
          HAS_FLOW_STATE: ${{ secrets.FLOW_STORAGE_STATE_B64 != '' }}
        run: |
          if [ "$HAS_FLOW_STATE" = "true" ]; then
            pip install playwright
            playwright install chromium
          else
            echo "FLOW_STORAGE_STATE_B64 미설정 -> 무료 스톡(Pexels/Pixabay) + FLUX 폴백 모드로 실행"
          fi

      - name: Run Automated Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION || 'us-central1' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_BGM_FOLDER_ID: ${{ secrets.GDRIVE_BGM_FOLDER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FLOW_STORAGE_STATE_B64: ${{ secrets.FLOW_STORAGE_STATE_B64 }}
          USE_GOOGLE_FLOW: ${{ secrets.FLOW_STORAGE_STATE_B64 != '' && 'true' || 'false' }}
          FLOW_HEADLESS: 'true'
          FLOW_MODEL: 'Gemini Omni'
          IMAGE_ENGINE: flux
          REUSE_FLOW_FOR_CTA: 'true'
          VISUAL_THEME: ${{ github.event.inputs.visual_theme || 'auto' }}
          # 훅(제목/훅/씬1 음성)에서 출생연도·띠, MBTI 4글자 호명 금지 (ig-audit: 정체성 호명 훅은 조회가 낮았음)
          HOOK_BAN_BIRTHYEAR: 'true'
          HOOK_BAN_MBTI: 'true'
          # 입력값은 env로 전달 (셸 인젝션/따옴표 문제 방지)
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_YT_SCHEDULE: ${{ github.event.inputs.youtube_schedule }}
        run: |
          ARGS=()
          if [ -n "$INPUT_TOPIC" ]; then
            ARGS+=(--topic "$INPUT_TOPIC")
          fi
          if [ -n "$INPUT_YT_SCHEDULE" ]; then
            ARGS+=(--youtube-schedule-kst "$INPUT_YT_SCHEDULE")
          fi
          python -m pipeline.auto_runner "${ARGS[@]}"

