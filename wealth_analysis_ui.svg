<svg width="420" height="1750" viewBox="0 0 420 1750" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .font-title { font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; font-weight: 900; }
  .font-bold { font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; font-weight: 700; }
  .font-medium { font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; font-weight: 500; }
</style>
<rect width="420" height="1750" fill="#F8FAFC"/>
<rect x="20" y="60" width="380" height="1630" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="210.0" y="100" text-anchor="middle" class="font-title" font-size="16" fill="#0F172A">재물 운명 심층 분석 결과</text>
<circle cx="210.0" cy="210" r="64" stroke="#F1F5F9" stroke-width="8" fill="none"/>
<circle cx="210.0" cy="210" r="64" stroke="#F59E0B" stroke-width="8" stroke-dasharray="402.1" stroke-dashoffset="88.5" stroke-linecap="round" fill="none" transform="rotate(-90 210.0 210)"/>
<text x="210.0" y="218" text-anchor="middle" class="font-title" font-size="32" fill="#0F172A">78</text>
<text x="210.0" y="235" text-anchor="middle" class="font-bold" font-size="10" fill="#F59E0B" letter-spacing="1">재물지수</text>
<text x="210.0" y="310" text-anchor="middle" class="font-title" font-size="18" fill="#0F172A">안정적 자산 형성과 체계적 분산 투자형</text>
<text x="40" y="345" class="font-title" font-size="12" fill="#94A3B8" letter-spacing="1.5">총평 및 재물 형세</text>
<rect x="40" y="360" width="340" height="164" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="56" y="384" class="font-medium" font-size="12" fill="#475569">귀하의 원국은 정재(正財) 격국을 갖추어</text>
<text x="56" y="404" class="font-medium" font-size="12" fill="#475569">허황된 일확천금보다는 단계적이고</text>
<text x="56" y="424" class="font-medium" font-size="12" fill="#475569">체계적인 연봉/자산 확장에 뛰어난 강점을</text>
<text x="56" y="444" class="font-medium" font-size="12" fill="#475569">보입니다. 오행 상 토(土)의 기반이</text>
<text x="56" y="464" class="font-medium" font-size="12" fill="#475569">강하므로 부동산이나 장기 우량주 등</text>
<text x="56" y="484" class="font-medium" font-size="12" fill="#475569">안정적인 자산 저장고에 투입할 때 재물</text>
<text x="56" y="504" class="font-medium" font-size="12" fill="#475569">운의 포텐셜이 극대화됩니다.</text>
<text x="40" y="559" class="font-title" font-size="12" fill="#94A3B8" letter-spacing="1.5">사주 명리학 분석</text>
<rect x="40" y="579" width="340" height="126" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="58" cy="599" r="4" fill="#F59E0B"/>
<text x="70" y="603" class="font-bold" font-size="12" fill="#1E293B">일간과 재성의 밸런스</text>
<text x="56" y="623" class="font-medium" font-size="11" fill="#475569">신왕재왕(身旺財旺)형 사주에</text>
<text x="56" y="641" class="font-medium" font-size="11" fill="#475569">가깝습니다. 스스로 주도권을 쥐고 사업을</text>
<text x="56" y="659" class="font-medium" font-size="11" fill="#475569">추진하거나 강한 집념으로 부를 성취할</text>
<text x="56" y="677" class="font-medium" font-size="11" fill="#475569">체력이 충분하며, 관리 능력이</text>
<text x="56" y="695" class="font-medium" font-size="11" fill="#475569">탁월합니다.</text>
<rect x="40" y="717" width="340" height="126" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="58" cy="737" r="4" fill="#6366F1"/>
<text x="70" y="741" class="font-bold" font-size="12" fill="#1E293B">재물 원국 구조 (격국)</text>
<text x="56" y="761" class="font-medium" font-size="11" fill="#475569">정재격(正財格)으로 안정 지향형 자산</text>
<text x="56" y="779" class="font-medium" font-size="11" fill="#475569">구성에 특화되어 있습니다. 무리한</text>
<text x="56" y="797" class="font-medium" font-size="11" fill="#475569">레버리지 투자를 할 경우 관성 파괴가</text>
<text x="56" y="815" class="font-medium" font-size="11" fill="#475569">발생할 수 있으니 분산 자산 포트폴리오</text>
<text x="56" y="833" class="font-medium" font-size="11" fill="#475569">유지가 관건입니다.</text>
<rect x="40" y="855" width="340" height="126" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="58" cy="875" r="4" fill="#0EA5E9"/>
<text x="70" y="879" class="font-bold" font-size="12" fill="#1E293B">오행 균형과 재물 공급력</text>
<text x="56" y="899" class="font-medium" font-size="11" fill="#475569">식신생재(食神生재) 흐름이</text>
<text x="56" y="917" class="font-medium" font-size="11" fill="#475569">매끄럽습니다. 일을 하여 재물을 공급받는</text>
<text x="56" y="935" class="font-medium" font-size="11" fill="#475569">원천 생상 능력이 왕성하며, 장기 연구나</text>
<text x="56" y="953" class="font-medium" font-size="11" fill="#475569">전문 자격증을 무기로 삼으면 고정 수입이</text>
<text x="56" y="971" class="font-medium" font-size="11" fill="#475569">폭발합니다.</text>
<text x="40" y="1011" class="font-title" font-size="12" fill="#94A3B8" letter-spacing="1.5">재물 대운 / 세운 흐름</text>
<rect x="40" y="1031" width="165" height="110" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="52" y="1055" class="font-bold" font-size="10" fill="#94A3B8" letter-spacing="1">올해 (2026년)</text>
<text x="52" y="1073" class="font-medium" font-size="10" fill="#475569">문서운과 이권</text>
<text x="52" y="1089" class="font-medium" font-size="10" fill="#475569">성취 기운이</text>
<text x="52" y="1105" class="font-medium" font-size="10" fill="#475569">강합니다. 부동산</text>
<text x="52" y="1121" class="font-medium" font-size="10" fill="#475569">매매나 계약</text>
<text x="52" y="1137" class="font-medium" font-size="10" fill="#475569">성사에 최고의</text>
<text x="52" y="1153" class="font-medium" font-size="10" fill="#475569">시기입니다.</text>
<rect x="215" y="1031" width="165" height="110" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="227" y="1055" class="font-bold" font-size="10" fill="#94A3B8" letter-spacing="1">내년 (2027년)</text>
<text x="227" y="1073" class="font-medium" font-size="10" fill="#475569">경쟁 구조 속</text>
<text x="227" y="1089" class="font-medium" font-size="10" fill="#475569">분탈 기운이</text>
<text x="227" y="1105" class="font-medium" font-size="10" fill="#475569">있으니 신규</text>
<text x="227" y="1121" class="font-medium" font-size="10" fill="#475569">동업이나 큰</text>
<text x="227" y="1137" class="font-medium" font-size="10" fill="#475569">투자는</text>
<text x="227" y="1153" class="font-medium" font-size="10" fill="#475569">지양하십시오.</text>
<rect x="40" y="1151" width="340" height="75" rx="16" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
<text x="52" y="1173" class="font-bold" font-size="10" fill="#D97706" letter-spacing="1">재물 피크 시기</text>
<text x="52" y="1189" class="font-medium" font-size="10.5" fill="#451A03">38세~42세 대운의 사화(巳火) 대운</text>
<text x="52" y="1204" class="font-medium" font-size="10.5" fill="#451A03">진입기. 인생 최고의 현금성 수익</text>
<text x="52" y="1219" class="font-medium" font-size="10.5" fill="#451A03">창출과 사업 확장의 적기입니다.</text>
<rect x="40" y="1236" width="340" height="75" rx="16" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
<text x="52" y="1258" class="font-bold" font-size="10" fill="#E11D48" letter-spacing="1">주의가 필요한 위험기</text>
<text x="52" y="1274" class="font-medium" font-size="10.5" fill="#4C0519">54세 전후 겁재(劫財) 충돌 시기.</text>
<text x="52" y="1289" class="font-medium" font-size="10.5" fill="#4C0519">가까운 지인의 투자 제안이나 무리한</text>
<text x="52" y="1304" class="font-medium" font-size="10.5" fill="#4C0519">보증으로 자산 손실 위험이</text>
<text x="52" y="1319" class="font-medium" font-size="10.5" fill="#4C0519">극대화됩니다.</text>
<text x="40" y="1346" class="font-title" font-size="12" fill="#94A3B8" letter-spacing="1.5">MBTI 기반 행동 처방전</text>
<rect x="40" y="1366" width="340" height="320" rx="24" fill="#0F172A"/>
<text x="56" y="1396" class="font-bold" font-size="10" fill="#F59E0B" letter-spacing="1.2">강점 발휘 (ESTJ)</text>
<text x="56" y="1414" class="font-medium" font-size="11" fill="#E2E8F0">철저한 우선순위 설정과 목표 지향적</text>
<text x="56" y="1432" class="font-medium" font-size="11" fill="#E2E8F0">자금 통제력을 활용하여 세는 돈을</text>
<text x="56" y="1450" class="font-medium" font-size="11" fill="#E2E8F0">차단하고 빈틈없는 투자 계획을 수립할 때</text>
<text x="56" y="1468" class="font-medium" font-size="11" fill="#E2E8F0">강점이 폭발합니다.</text>
<line x1="56" y1="1490" x2="364" y2="1490" stroke="#334155" stroke-width="1"/>
<text x="56" y="1508" class="font-bold" font-size="10" fill="#38BDF8" letter-spacing="1.2">약점 제어</text>
<text x="56" y="1526" class="font-medium" font-size="11" fill="#E2E8F0">때로는 타인의 직관적인 피드백이나</text>
<text x="56" y="1544" class="font-medium" font-size="11" fill="#E2E8F0">신기술 투자 시장(IT/크립토 등)을</text>
<text x="56" y="1562" class="font-medium" font-size="11" fill="#E2E8F0">배척하기 쉬우니 유연한 자세로 트렌드를</text>
<text x="56" y="1580" class="font-medium" font-size="11" fill="#E2E8F0">청취하는 시도가 필요합니다.</text>
<line x1="56" y1="1602" x2="364" y2="1602" stroke="#334155" stroke-width="1"/>
<text x="56" y="1620" class="font-bold" font-size="10" fill="#A78BFA" letter-spacing="1.2">실천 계획</text>
<text x="56" y="1638" class="font-medium" font-size="11" fill="#E2E8F0">월 자산 정산 시스템을 수립하고 고정</text>
<text x="56" y="1656" class="font-medium" font-size="11" fill="#E2E8F0">지출 비율을 총소득의 45% 이하로</text>
<text x="56" y="1674" class="font-medium" font-size="11" fill="#E2E8F0">통제하는 구체적인 예산 구조화를 당장</text>
<text x="56" y="1692" class="font-medium" font-size="11" fill="#E2E8F0">실행하십시오.</text>
<text x="40" y="1721" class="font-title" font-size="12" fill="#94A3B8" letter-spacing="1.5">재물운 부스터 (행운의 요소)</text>
<rect x="40" y="1741" width="108" height="45" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="94.0" y="1767" text-anchor="middle" class="font-bold" font-size="11" fill="#475569">숫자 5, 10</text>
<rect x="156" y="1741" width="108" height="45" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="210.0" y="1767" text-anchor="middle" class="font-bold" font-size="11" fill="#475569">황금색 / 주황색</text>
<rect x="272" y="1741" width="108" height="45" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="326.0" y="1767" text-anchor="middle" class="font-bold" font-size="11" fill="#475569">남쪽 방향 / 고층</text>
<rect x="40" y="1826" width="165" height="48" rx="16" fill="#F1F5F9"/>
<text x="122.5" y="1854" text-anchor="middle" class="font-bold" font-size="12" fill="#0F172A">이미지 저장</text>
<rect x="215" y="1826" width="165" height="48" rx="16" fill="#0F172A"/>
<text x="297.5" y="1854" text-anchor="middle" class="font-bold" font-size="12" fill="#FFFFFF">다시 분석하기</text>
</svg>